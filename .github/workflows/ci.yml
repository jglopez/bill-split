name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: corepack enable

      - run: npm ci

      # Block on high/critical advisories in shipped (runtime) dependencies
      # only. Dev-only tooling advisories can have no patched release yet and
      # would otherwise block every PR; the scheduled Security audit workflow
      # still checks the full tree, and Dependabot surfaces the rest.
      - run: npm audit --omit=dev --audit-level=high

      - run: npm run typecheck

      - run: npm run lint

      - run: npx vite build

      - run: npm test
