version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "version:patch"
    open-pull-requests-limit: 10
    # One grouped PR per run instead of one PR per dependency, so a weekly
    # update batch produces a single release + deploy (auto-release.yml runs
    # per merged PR).
    groups:
      npm-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      npm-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # typescript-eslint pins typescript to <6.1.0, so a TS 7 bump breaks
      # npm ci with ERESOLVE. Remove this once typescript-eslint supports
      # TS 7 and bump both together.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    labels:
      - "version:patch"
    open-pull-requests-limit: 5
    groups:
      actions-dependencies:
        applies-to: version-updates
        patterns: ["*"]
      actions-security:
        applies-to: security-updates
        patterns: ["*"]
